<div class="container p-10">
  <div>
    <input [(ngModel)]="searchTitle" type="text" placeholder="Buscar chollo por título" />
    <button (click)="searchChollo()">Buscar</button>
  </div>
  <p></p>

  <div class="cards-wrapper"></div>

  <h1>Listado de Chollos</h1>
  <mat-divider></mat-divider>

  <div class="grid">

      <div *ngFor="let chollo of chollos"
        class="col-12 sm:col-12 md:col-12 xl:col-12">
          <chollos-chollo-card [chollo]="chollo"></chollos-chollo-card>
      </div>
    </div>
  </div>
